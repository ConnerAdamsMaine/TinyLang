language = "C"
include_guard = "TINYLANG_H"
pragma_once = true
cpp_compat = true
include_version = true
autogen_warning = "/* Generated by cbindgen from the TinyLang C ABI. Do not edit by hand. */"
sys_includes = ["stdint.h", "stdbool.h", "stddef.h"]
after_includes = "#define TINYLANG_ABI_VERSION 2u"

[export]
item_types = ["functions"]
include = [
  "tinylang_abi_version",
  "tinylang_free_string",
  "tinylang_lex_source_json",
  "tinylang_compile_source_json",
  "tinylang_compile_file_json",
  "tinylang_run_source_json",
  "tinylang_run_file_json",
  "tinylang_run_artifact_json",
  "tinylang_jit_listing_json",
]
