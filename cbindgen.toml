language = "C"
include_guard = "TYNRA_H"
pragma_once = true
cpp_compat = true
include_version = true
autogen_warning = "/* Generated by cbindgen from the Tynra C ABI. Do not edit by hand. */"
sys_includes = ["stdint.h", "stdbool.h", "stddef.h"]
after_includes = "#define TYNRA_ABI_VERSION 2u"

[export]
item_types = ["functions"]
include = [
  "tynra_abi_version",
  "tynra_free_string",
  "tynra_lex_source_json",
  "tynra_compile_source_json",
  "tynra_compile_file_json",
  "tynra_run_source_json",
  "tynra_run_file_json",
  "tynra_run_artifact_json",
  "tynra_jit_listing_json",
]
