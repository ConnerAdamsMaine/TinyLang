[package]
name = "tinylang-v2-abi"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "tinylang_v2"
crate-type = ["rlib", "cdylib"]

[dependencies]
tinyone = { package = "tinylang", path = "../crates/tinyone_core" }
thiserror = "2"
cranelift-codegen = { version = "0.125", optional = true }
cranelift-frontend = { version = "0.125", optional = true }
cranelift-jit = { version = "0.125", optional = true }
cranelift-module = { version = "0.125", optional = true }
cranelift-native = { version = "0.125", optional = true }

[features]
default = []
cranelift = [
    "dep:memmap2",
    "dep:cranelift-codegen",
    "dep:cranelift-frontend",
    "dep:cranelift-jit",
    "dep:cranelift-module",
    "dep:cranelift-native",
]

[workspace]

[target.'cfg(not(windows))'.dependencies]
memmap2 = { version = "0.9", optional = true }
