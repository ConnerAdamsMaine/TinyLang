[package]
name                   = "tinylang_ralloc"
version                = "0.2.0"
edition.workspace      = true
description            = "Fixed-capacity arena allocator backing the TinyLang runtime"
license-file.workspace = true
repository.workspace   = true
readme                 = "README.md"
keywords               = [ "allocator", "arena", "memory", "runtime" ]
categories             = [ "memory-management" ]

[lib]
name       = "ralloc"
path       = "src/lib.rs"
crate-type = [ "rlib", "cdylib", "staticlib" ]

[features]
default       = [ "rlib" ]
rlib          = [  ]
cdylib        = [  ]
c-staticlib   = [  ]
testing-hooks = [  ]

[dependencies]

[dev-dependencies]
tempfile              = "3"
static_assertions     = "1"
tinylang_test_support = { version = "0.1.0", path = "../tinylang_test_support" }
