# cargo-features = ["codegen-backend", "trim-paths"]
# Requires nightly for codegen-backend / trim-paths; see docs/CI_CD.md and [profile.*] comments
[workspace]
members         = [ "crates/tinylang_*", "crates/xtask" ]
exclude         = [ ".archive" ]
default-members = [ "crates/tinylang_core" ]
resolver        = "3"

[workspace.package]
edition      = "2024"
license-file = "LICENSE"
repository   = "https://github.com/ConnerAdamsMaine/TinyOne"

# Development build
[profile.dev]
opt-level     = 1
codegen-units = 256
incremental   = true
# codegen-backend = "cranelift" # May break deps. Requires nightly + cargo-features = ["codegen-backend"]
debug            = "line-tables-only"
debug-assertions = true
overflow-checks  = true
strip            = "none"
panic            = "unwind"
lto              = "off"
# trim-paths = "none" # requires cargo-features = ["trim-paths"] + nightly

# Standard release (original no-LTO baseline)
[profile.release]
opt-level         = 3
codegen-units     = 1
incremental       = false
debug             = 0
debug-assertions  = false
overflow-checks   = false
strip             = "symbols"
panic             = "unwind"
lto               = "off"

# Fast compilation
[profile.fast]
inherits       = "release"
opt-level      = 2
codegen-units  = 64
incremental    = true
lto            = "off"

# Thin link-time optimization
[profile.thin]
inherts        = "release"
opt-level      = 3
codegen-units  = 4
incremental    = false
lto            = "thin"

# Fat link-time optimization
[profile.fat]
inherts        = "release"
opt-level      = 3
codegen-units  = 4
incremental    = false
lto            = "fat"

[workspace.lints.rust]
unsafe_code = { level = "forbid", priority = 0 }

[workspace.lints.clippy]
enum_glob_use = { level = "warn", priority = 2 }
